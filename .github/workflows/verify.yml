name: Verify standalone toolkit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.12.10
      - name: Install locked bridge and run contracts
        run: |
          uv sync --directory pixelspark-art-mcp --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --directory pixelspark-art-mcp --frozen python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --directory pixelspark-art-mcp --frozen python -m unittest discover -s ../tests -p "test_*.py"
      - name: Build distributions
        run: |
          uv build --project aseprite-mcp --out-dir generated/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv build --project pixelspark-art-mcp --out-dir generated/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --directory pixelspark-art-mcp --frozen python ../tests/check_wheels.py ../generated/dist
      - uses: actions/upload-artifact@v6
        with:
          name: toolkit-distributions
          path: generated/dist
